  <text x="1355" y="55" text-anchor="end" fill="#416f70" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">RECEPTION FIELD / V 1.0</text>
  <g fill="#e2eae5" stroke="#416f70" stroke-width="2">
    <rect x="82" y="96" width="460" height="120"/>
    <rect x="858" y="96" width="460" height="120"/>
  </g>
  <g fill="#173c4b" font-family="Georgia,serif" font-size="34">
    <text x="110" y="148">Heideggerian question</text>
    <text x="886" y="148">Corbin / ta’wil / imaginal</text>
  </g>
  <g fill="#52656b" font-family="Arial,sans-serif" font-size="18">
    <text x="110" y="185">worldhood · hermeneutics · language</text>
    <text x="886" y="185">Suhrawardi · image as disclosure</text>
  </g>
