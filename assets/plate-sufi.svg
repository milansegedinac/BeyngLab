  <text x="700" y="875" text-anchor="middle" fill="#bdd1cb" font-family="Arial,sans-serif" font-size="18">describe · interpret · ask who is absent · revise</text>
  <path d="M50 959H1350" stroke="#173c4b" stroke-width="2"/>
  <text x="50" y="993" fill="#173c4b" font-family="Georgia,serif" font-style="italic" font-size="23">The branches organize questions. They do not prove descent.</text>
  <text x="1350" y="993" text-anchor="end" fill="#416f70" font-family="Arial,sans-serif" font-size="15">SOLID / HINGE · THIN / COMPARISON · DASHED / RESONANCE</text>
</svg>
