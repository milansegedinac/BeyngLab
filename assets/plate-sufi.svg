<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Sufi Heidegger after Corbin</title>
  <desc id="desc">Heideggerian questions lead to Corbin's ta’wil and imaginal hinge. Four distinct intellectual afterlives and four film/art resonances branch outward, returning to a workshop and risk ledger.</desc>
