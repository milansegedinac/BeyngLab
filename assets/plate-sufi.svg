  <path d="M1088 216V274M225 274H1175M225 274V303M542 274V303M858 274V303M1175 274V303" fill="none" stroke="#416f70" stroke-width="2"/>
  <text x="45" y="289" fill="#416f70" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">DISTINCT AFTERLIVES</text>
  <g fill="#fffdf7" stroke="#9fb8b0" stroke-width="2">
    <rect x="72" y="303" width="302" height="166"/><rect x="390" y="303" width="302" height="166"/>
